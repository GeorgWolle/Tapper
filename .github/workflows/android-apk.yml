name: Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pages:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: tapper-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare website
        run: |
          mkdir site
          cp index.html manifest.webmanifest icon.svg site/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: tapper-apk-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Bubblewrap
        run: npm ci
      - name: Configure Android SDK and Bubblewrap
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] || \
             [ ! -x "$ANDROID_HOME/build-tools/36.1.0/apksigner" ] || \
             [ ! -x "$ANDROID_HOME/platform-tools/adb" ]; then
            (set +o pipefail; yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null)
            "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-36" "build-tools;36.1.0" "platform-tools"
          fi
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("fs").writeFileSync(process.env.HOME + "/.bubblewrap/config.json", JSON.stringify({jdkPath: process.env.JAVA_HOME, androidSdkPath: process.env.ANDROID_HOME}))'
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_WEB_URL: ${{ vars.ANDROID_WEB_URL }}
        run: |
          mkdir -p android
          trap 'if [ -n "${ICON_SERVER_PID:-}" ]; then kill "$ICON_SERVER_PID"; fi; rm -f android/android.keystore' EXIT
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            if [[ ! "$BUBBLEWRAP_KEYSTORE_PASSWORD" =~ ^[a-zA-Z0-9._=-]+$ ]] || [[ ! "$BUBBLEWRAP_KEY_PASSWORD" =~ ^[a-zA-Z0-9._=-]+$ ]]; then
              echo "::error::Set both signing passwords using only letters, digits, dot, underscore, equals or hyphen."
              exit 1
            fi
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/android.keystore
            echo "Signing with the persistent repository key." >> "$GITHUB_STEP_SUMMARY"
          else
            if [ -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" ] || [ -n "$BUBBLEWRAP_KEY_PASSWORD" ]; then
              echo "::error::Provide all three signing secrets, or none."
              exit 1
            fi
            export BUBBLEWRAP_KEYSTORE_PASSWORD="$(openssl rand -hex 32)"
            export BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD"
            echo "::add-mask::$BUBBLEWRAP_KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -storetype JKS \
              -keystore android/android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Tapper" \
              -storepass:env BUBBLEWRAP_KEYSTORE_PASSWORD \
              -keypass:env BUBBLEWRAP_KEY_PASSWORD
            echo "::warning::Temporary signing key: uninstall any previous APK before installing this build. Configure signing secrets for updateable APKs."
            echo "Temporary signing key: uninstall an older build before installing this APK." >> "$GITHUB_STEP_SUMMARY"
          fi
          chmod 600 android/android.keystore
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
          const url = new URL(process.env.ANDROID_WEB_URL || `https://${process.env.GITHUB_REPOSITORY_OWNER.toLowerCase()}.github.io/${process.env.GITHUB_REPOSITORY.split('/')[1]}/`);
          if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
            throw new Error('ANDROID_WEB_URL must be an HTTPS URL without credentials, query or fragment.');
          }
          manifest.host = url.host;
          manifest.startUrl = url.pathname;
          manifest.iconUrl = 'http://127.0.0.1:8000/icon.svg';
          manifest.appVersionCode = Number(process.env.GITHUB_RUN_NUMBER);
          manifest.appVersion = String(manifest.appVersionCode);
          fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          NODE
          FINGERPRINT="$(keytool -J-Duser.language=en -list -v \
            -keystore android/android.keystore -alias android \
            -storepass:env BUBBLEWRAP_KEYSTORE_PASSWORD |
            sed -n 's/^[[:space:]]*SHA256: //p')"
          test -n "$FINGERPRINT"
          ./node_modules/.bin/bubblewrap fingerprint add "$FINGERPRINT" \
            --manifest=twa-manifest.json --name=github-actions --output=android/assetlinks.json
          python3 -m http.server 8000 --bind 127.0.0.1 > "$RUNNER_TEMP/tapper-icon-server.log" 2>&1 &
          ICON_SERVER_PID=$!
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8000/icon.svg > /dev/null
          npm run build:android
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose android/app-release-signed.apk
          echo "Download **app-release-signed.apk** from this run's artifacts. The APK opens the hosted website, not an offline copy of index.html." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload installable APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: android/app-release-signed.apk
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload public Digital Asset Links
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tapper-assetlinks
          path: android/assetlinks.json
          if-no-files-found: error
          retention-days: 30
